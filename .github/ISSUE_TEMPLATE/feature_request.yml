name: Feature request
description: Suggest an idea for this project.
title: "[FEATURE REQUEST] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or gets in your way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: What should happen instead.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, examples from other versions of the game, or other context.
    validations:
      required: false
