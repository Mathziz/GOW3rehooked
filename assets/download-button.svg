<svg xmlns="http://www.w3.org/2000/svg" width="286" height="58" viewBox="0 0 286 58" role="img" aria-label="Download latest release">
  <defs>
    <linearGradient id="capSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
  </defs>

  <!-- Soft contact shadow beneath the 3D keycap lip -->
  <rect x="2" y="9" width="282" height="48" rx="11" fill="#000000" fill-opacity="0.22"/>
  <!-- 3D keycap bottom lip (Theme::PS4BtnBorder edge) -->
  <rect x="2" y="7" width="282" height="48" rx="11" fill="#252531" stroke="#363644" stroke-width="1.5"/>
  <!-- Keycap top face (Theme::PS4BtnBg) -->
  <rect x="2" y="1.5" width="282" height="48" rx="11" fill="url(#capSurface)" stroke="#48485c" stroke-width="1.5"/>
  <!-- Subtle inner bevel + top catch-light -->
  <rect x="3.5" y="3" width="279" height="45" rx="9.5" fill="none" stroke="#ffffff" stroke-opacity="0.086" stroke-width="1"/>
  <line x1="14" y1="3" x2="272" y2="3" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-linecap="round"/>

  <!-- Geometric download glyph directly on keycap face (DrawKeyCap arrow + tray) -->
  <line x1="33" y1="15.5" x2="33" y2="26.5" stroke="#fef3c7" stroke-width="2.6" stroke-linecap="round"/>
  <polygon points="33,30.5 27.5,24 38.5,24" fill="#fef3c7"/>
  <path d="M23.5 31.5v2.5a1.5 1.5 0 0 0 1.5 1.5h16a1.5 1.5 0 0 0 1.5-1.5v-2.5" fill="none" stroke="#c99e4b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle key divider -->
  <line x1="59" y1="13.5" x2="59" y2="37.5" stroke="#363644" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Left-aligned keycap label (Theme::GoldLight / Theme::GoldBronze) -->
  <text x="74" y="23" text-anchor="start" fill="#fef3c7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="800" letter-spacing="1.8">DOWNLOAD</text>
  <text x="74" y="38.5" text-anchor="start" fill="#c99e4b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.2">Latest release</text>
</svg>
